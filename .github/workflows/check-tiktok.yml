name: 🔴 PROT PUPAM — Check TikTok Videos

on:
  schedule:
    # Mỗi 7 ngày, chạy vào 8:00 sáng Chủ Nhật
    - cron: '0 8 * * 0'
  workflow_dispatch:  # Cho phép chạy tay

env:
  TIKTOK_USERNAME: bobubammm
  PYTHON_VERSION: '3.11'

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Giới hạn thời gian chạy
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 🎬 Cài FFmpeg + yt-dlp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp
          ffmpeg -version | head -1
          yt-dlp --version

      - name: 🔍 Check & Analyze TikTok
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIKTOK_USERNAME: bobubammm
          MAX_VIDEOS_PER_RUN: '2'
        run: python scripts/analyze.py
